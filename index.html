        const inputAgentName = document.getElementById('agentName');

            selectMonth.appendChild(new Option(`${i} 月`, i));
        }

        function updateDays() {
            const m = parseInt(selectMonth.value);
            const currentSelectedDay = parseInt(selectDay.value);
            selectDay.innerHTML = '<option value="">選擇日期</option>';
            if (!m) return;
            const daysInMonth = new Date(2024, m, 0).getDate(); 
            for (let i = 1; i <= daysInMonth; i++) {
                selectDay.appendChild(new Option(`${i} 日`, i));
            }
            if (currentSelectedDay && currentSelectedDay <= daysInMonth) {
                selectDay.value = currentSelectedDay;
            }
        }

        selectMonth.addEventListener('change', updateDays);

        const savedName = localStorage.getItem('agentName');
        const savedMonth = localStorage.getItem('userBirthMonth');
        const savedDay = localStorage.getItem('userBirthDay');

        if (savedMonth) {
            selectMonth.value = savedMonth;
            updateDays();
            if (savedDay) selectDay.value = savedDay;
        } else {
            updateDays();

        function digitalRoot(n) { return n === 0 ? 0 : (n - 1) % 9 + 1; }
        function getPersonalYear(tYear, tMonth, bMonth, bDay) { return digitalRoot((tMonth < bMonth ? tYear - 1 : tYear) + bMonth + bDay); }
        function getPersonalMonth(pYear, cMonth) { return digitalRoot(pYear + cMonth); }
        function getPersonalDay(pMonth, cDay) { return digitalRoot(pMonth + cDay); }

        async function recordUsageToSheet(agentName, targetMonth, bMonth, bDay) {
            if (!GAS_API_URL || GAS_API_URL.includes("請把您的_GAS_網址貼在這裡")) return;
            try {
                const payload = { 
                    name: agentName || "未具名業務", 
                    action: "產出專屬工作曆", 
                    targetMonth: targetMonth,
                    bMonth: bMonth,
                    bDay: bDay
                };
                fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" } }).catch(e => console.log("紀錄發送失敗"));
            } catch (e) { console.log(e); }
        }

        let currentCalendarState = { year: null, month: null, pMonth: null, agentName: '' };

        document.getElementById('generateBtn').addEventListener('click', () => {
            const agentName = inputAgentName.value.trim();
            const bMonth = parseInt(selectMonth.value);
            const bDay = parseInt(selectDay.value);
            const targetVal = targetMonthInput.value; 

            if (!bMonth || !bDay || !targetVal) {
                document.getElementById('errorMsg').classList.remove('hidden'); return;
            }
            document.getElementById('errorMsg').classList.add('hidden');

            localStorage.setItem('agentName', agentName);
            localStorage.setItem('userBirthMonth', bMonth);
            localStorage.setItem('userBirthDay', bDay);

            recordUsageToSheet(agentName, targetVal, bMonth, bDay);

            const [tYear, tMonth] = targetVal.split('-').map(Number);
            const pYear = getPersonalYear(tYear, tMonth, bMonth, bDay);
            const pMonth = getPersonalMonth(pYear, tMonth);

            document.getElementById('calendarTitle').innerText = `${tYear} 年 ${tMonth} 月 - ${agentName ? agentName+' 的' : ''}專屬工作曆`;
            document.getElementById('displayPersonalYear').innerText = pYear;
            document.getElementById('displayPersonalMonth').innerText = pMonth;
            
            const yearKw = ["開創播種", "耐心扎根", "展現交流", "穩定建設", "變動拓展", "責任服務", "學習沉澱", "豐收成就", "總結重整"];
            document.getElementById('yearDesc').innerText = `${yearKw[pYear-1]}之年`;
            document.getElementById('monthDesc').innerText = `${yearKw[pMonth-1]}之月`;

            generateCalendarGrid(tYear, tMonth, pMonth, agentName);
            currentCalendarState = { year: tYear, month: tMonth, pMonth: pMonth, agentName: agentName };

            const resultSection = document.getElementById('resultSection');
            resultSection.classList.remove('hidden');
            setTimeout(() => resultSection.classList.remove('opacity-0'), 50);
            setTimeout(() => resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
        });

        function generateCalendarGrid(year, month, pMonth, agentName) {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = ''; 
            const firstDay = new Date(year, month - 1, 1).getDay();
            const daysInMonth = new Date(year, month, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const div = document.createElement('div'); div.className = "p-2 bg-transparent"; grid.appendChild(div);
            }

            const todayDate = new Date();
            const isCurrentMonth = (todayDate.getFullYear() === year && todayDate.getMonth() + 1 === month);

            for (let day = 1; day <= daysInMonth; day++) {
                const pDay = getPersonalDay(pMonth, day);
                const flow = workflowData[pDay];
                const isToday = isCurrentMonth && (day === todayDate.getDate());
                
                const cell = document.createElement('div');
                cell.className = `day-cell relative bg-white border border-slate-200 rounded-xl p-2 md:p-3 cursor-pointer min-h-[80px] md:min-h-[100px] flex flex-col ${isToday ? "ring-2 ring-primary ring-offset-2" : ""}`;
                cell.innerHTML = `<div class="flex justify-between items-start mb-1"><span class="text-sm md:text-base font-semibold ${isToday ? 'text-primary' : 'text-slate-700'}">${day}</span><span class="w-5 h-5 md:w-6 md:h-6 rounded-full ${flow.color} border flex items-center justify-center text-xs font-bold shadow-sm">${pDay}</span></div><div class="mt-auto text-center"><div class="text-xs md:text-sm font-bold ${flow.textColor} mb-1 truncate">${flow.short}</div><i class="fa-solid ${flow.icon} ${flow.textColor} opacity-60 text-sm md:text-base mt-1"></i></div>`;
                cell.addEventListener('click', () => openModal(year, month, day, pMonth, pDay, flow, agentName));
                grid.appendChild(cell);
            }
        }

        let currentModalState = { year: null, month: null, day: null, pMonth: null, pDay: null, flow: null, agentName: '' };
        const modal = document.getElementById('dayModal');
        const modalContent = document.getElementById('modalContent');

            currentModalState = { year, month, day, pMonth, pDay, flow, agentName };
            document.getElementById('modalHeader').className = `relative p-6 text-white text-center transition-colors duration-300 ${flow.modalClass}`;

            document.getElementById('modalSubtitle').innerText = flow.subtitle || '';

            const greetingEl = document.getElementById('modalAgentGreeting');
            if (agentName) {
                greetingEl.innerText = `🙌 ${agentName}，準備好今天的行動了嗎？`; greetingEl.classList.remove('hidden');

            document.getElementById('modalTip').innerText = flow.tip;
            document.getElementById('modalTagline').innerText = flow.tagline || '';
            document.getElementById('modalQuote').innerText = flow.quote || '';

            const actionList = document.getElementById('modalActionList'); actionList.innerHTML = '';
            flow.actions.forEach(action => { const li = document.createElement('li'); li.innerText = action; actionList.appendChild(li); });

            // 夜間 21:00 執行檢視（Checklist，含 localStorage 記憶勾選狀態）
            const checklistEl = document.getElementById('modalChecklist');
            checklistEl.innerHTML = '';
            const checkKey = `checklist_${year}_${month}_${day}`;
            const savedChecks = JSON.parse(localStorage.getItem(checkKey) || '[]');
            (flow.checklist || []).forEach((item, idx) => {
                const isChecked = savedChecks[idx] || false;
                const div = document.createElement('div');
                div.className = 'flex items-start gap-3';
                div.innerHTML = `<input type="checkbox" id="chk_${idx}" class="mt-0.5 w-4 h-4 rounded cursor-pointer flex-shrink-0" style="accent-color:#4f46e5" ${isChecked ? 'checked' : ''}><label for="chk_${idx}" class="text-sm text-slate-600 cursor-pointer leading-snug select-none">${item}</label>`;
                div.querySelector('input').addEventListener('change', () => {
                    const checks = (flow.checklist || []).map((_, i) => { const el = document.getElementById(`chk_${i}`); return el ? el.checked : false; });
                    localStorage.setItem(checkKey, JSON.stringify(checks));
                });
                checklistEl.appendChild(div);
            });

            modal.classList.remove('hidden'); modal.classList.add('flex');
            requestAnimationFrame(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); modalContent.classList.add('scale-100'); });

        function closeModal() {
            modal.classList.add('opacity-0'); modalContent.classList.remove('scale-100'); modalContent.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300); 
        }

        document.getElementById('closeModal').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        function formatDateForICS(year, month, day) { return `${year}${String(month).padStart(2, '0')}${String(day).padStart(2, '0')}`; }
        
        function foldLine(line) {
            const MAX_LENGTH = 73; let result = '';
            while (line.length > 0) {
                if (result.length > 0) result += '\r\n ';
                result += line.substring(0, MAX_LENGTH); line = line.substring(MAX_LENGTH);
            }
            return result;
        }

        function generateICSEvent(year, month, day, pMonth, pDay, flow, agentName) {
            const startDate = formatDateForICS(year, month, day);
            const nextDay = new Date(year, month - 1, day + 1);
            const endDate = formatDateForICS(nextDay.getFullYear(), nextDay.getMonth() + 1, nextDay.getDate());
            const actionString = flow.actions.map(a => `- ${a}`).join('\\n');
            const prefix = agentName ? `[${agentName}] ` : '';
            const greeting = agentName ? `嗨 ${agentName}！\\n` : '';
            const rawDescription = `${greeting}🔢 當日能量：流月 ${pMonth} ✕ 流日 ${pDay}\\n\\n🎯 目標：${flow.goal}\\n\\n📋 行動建議：\\n${actionString}\\n\\n💡 能量提醒：${flow.tip}`;
            
            return `BEGIN:VEVENT\r
DTSTART;VALUE=DATE:${startDate}\r
DTEND;VALUE=DATE:${endDate}\r
SUMMARY:${foldLine(`${prefix}【${flow.short}】${flow.name}`)}\r
DESCRIPTION:${foldLine(rawDescription)}\r
TRANSP:TRANSPARENT\r
END:VEVENT\r\n`;
        }

        function downloadICS(content, filename) {
            const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = filename;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        document.getElementById('exportMonthBtn').addEventListener('click', () => {
            const { year, month, pMonth, agentName } = currentCalendarState;
            if (!year) return;
            let icsContent = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Numerology Calendar//TW\r\nCALSCALE:GREGORIAN\r\n`;
            const daysInMonth = new Date(year, month, 0).getDate();
            for (let day = 1; day <= daysInMonth; day++) icsContent += generateICSEvent(year, month, day, pMonth, getPersonalDay(pMonth, day), workflowData[getPersonalDay(pMonth, day)], agentName);
            icsContent += `END:VCALENDAR`;
            downloadICS(icsContent, `${agentName ? agentName+'_' : ''}生命靈數工作曆_${year}年${month}月.ics`);
        });

        document.getElementById('exportDayBtn').addEventListener('click', () => {
            const { year, month, day, pMonth, pDay, flow, agentName } = currentModalState;
            if (!year) return;
            let icsContent = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Numerology Calendar//TW\r\nCALSCALE:GREGORIAN\r\n`;
            icsContent += generateICSEvent(year, month, day, pMonth, pDay, flow, agentName);
            icsContent += `END:VCALENDAR`;
            downloadICS(icsContent, `${agentName ? agentName+'_' : ''}生命靈數_${month}月${day}日_${flow.short}.ics`);
        });
    </script>
</body>
</html>
